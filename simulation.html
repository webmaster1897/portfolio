<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MS Simulation | Computer Science Portfolio</title>

    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>

        /* ==============================
           RESET
        ================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ==============================
           VARIABLES
        ================================ */

        :root {
            --green: #17382e;
            --paper: #f5f0e1;
            --yellow: #e8a33d;
            --coral: #e2725b;
            --text: #20261f;
        }


        /* ==============================
           BODY
        ================================ */

        body {
            font-family: "Work Sans", sans-serif;
            background: var(--paper);
            color: var(--text);
            min-height: 100vh;
        }


        /* ==============================
           HEADER
        ================================ */

        .page-header {
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255,255,255,.05),
                    transparent 40%
                ),
                var(--green);

            color: var(--paper);
            padding: 20px 20px;
            position: relative;
            overflow: hidden;
        }


        .page-header::before {
            content: "";
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                );

            background-size: 40px 40px;
        }


        .header-content {
            max-width: 1100px;
            margin: auto;
            position: relative;
            z-index: 2;
        }


        .eyebrow {
            display: inline-block;

            font-family: "IBM Plex Mono", monospace;
            font-size: 12px;
            letter-spacing: 2px;

            color: var(--yellow);

            border: 1px solid rgba(232,163,61,.5);

            padding: 8px 14px;
            border-radius: 50px;

            margin-bottom: 25px;
        }


        .page-header h1 {
            font-family: "Kalam", cursive;
            font-size: clamp(50px, 8vw, 90px);
            line-height: 1;
            margin-bottom: 25px;
        }


        .page-header h1 span {
            color: var(--yellow);
        }


        .page-header p {
            max-width: 650px;
            font-size: 18px;
            line-height: 1.7;
            color: #d9e3db;
        }


        /* ==============================
           SIMULATION SECTION
        ================================ */

        .simulation-section {
            padding: 80px 20px;
        }


        .container {
            max-width: 1100px;
            margin: auto;
        }


        /* ==============================
           SECTION HEADING
        ================================ */

        .section-heading {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            margin-bottom: 45px;
        }


        .number {
            font-family: "IBM Plex Mono", monospace;
            color: var(--coral);
            font-size: 15px;
            padding-top: 8px;
        }


        .small-title {
            font-family: "IBM Plex Mono", monospace;
            color: #777163;
            font-size: 11px;
            letter-spacing: 2px;
        }


        .section-heading h2 {
            font-family: "Kalam", cursive;
            font-size: 42px;
            margin: 5px 0 8px;
        }


        .section-heading p {
            max-width: 650px;
            color: #666052;
            line-height: 1.7;
        }


        /* ==============================
           FLEXBOX GALLERY
        ================================ */

        .simulation-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            width: 100%;
        }


        /* ==============================
           CARDS
        ================================ */

        .simulation-card {
            position: relative;

            flex: 1 1 calc(33.333% - 20px);
            min-width: 280px;

            height: 260px;

            overflow: hidden;
            border-radius: 14px;

            background: transparent;

            border: 2px solid transparent;

            box-shadow:
                0 10px 25px rgba(28,59,50,.10);

            transition:
                transform .35s ease,
                box-shadow .35s ease,
                border-color .35s ease;
        }


        .simulation-card:hover {
            transform: translateY(-10px);

            border-color: var(--yellow);

            box-shadow:
                0 25px 50px rgba(28,59,50,.22);
        }


        /* ==============================
           IMAGE CARDS
        ================================ */

        .simulation-card > img {
            width: 100%;
            height: 100%;

            object-fit: cover;
            display: block;

            transition:
                transform .6s ease,
                filter .4s ease;
        }


        .simulation-card:hover > img {
            transform: scale(1.08);
            filter: brightness(.7);
        }


        /* ==============================
           VIDEO
        ================================ */

        .video-card {
            position: relative;
            background: transparent;
        }


        .hover-video {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            opacity: 1;

            z-index: 1;

            background: transparent;

            pointer-events: none;
        }


        /* ==============================
           VIDEO OVERLAY
        ================================ */

        .video-card .card-overlay {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            padding: 25px 20px 18px;

            background:
                linear-gradient(
                    transparent,
                    rgba(0,0,0,.85)
                );

            color: white;

            z-index: 2;

            pointer-events: none;
        }


        .card-overlay span {
            font-family: "IBM Plex Mono", monospace;
            font-size: 10px;
            letter-spacing: 1.5px;
            color: var(--yellow);
        }


        .card-overlay h3 {
            font-family: "Kalam", cursive;
            font-size: 24px;
            margin-top: 3px;
        }


        /* ==============================
           RESPONSIVE
        ================================ */

        @media (max-width: 900px) {

            .simulation-card {
                flex-basis: calc(50% - 20px);
            }

        }


        @media (max-width: 600px) {

            .page-header {
                padding: 65px 20px;
            }


            .simulation-section {
                padding: 55px 15px;
            }


            .section-heading {
                gap: 12px;
            }


            .section-heading h2 {
                font-size: 34px;
            }


            .simulation-card {
                flex-basis: 100%;
                min-width: 100%;
                height: 260px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="page-header">

        <div class="header-content">

            <span class="eyebrow">
                COMPUTER SCIENCE · PORTFOLIO
            </span>

            <h1>
                 <span>Simulation</span>
            </h1>

            <p>
              
            </p>

        </div>

    </header>


    <!-- =========================
         SIMULATION PROJECT SECTION
    ========================== -->

    <section class="simulation-section">

        <div class="container">


            <!-- SECTION HEADING -->

            <div class="section-heading">

                <span class="number">
                    01
                </span>

                <div>

                

                    <h2>
                         Simulation Projects
                    </h2>

                  

                </div>

            </div>


            <!-- =========================
                 FLEXBOX GALLERY
            ========================== -->

            <div class="simulation-gallery">


                <!-- =========================
                     CARD 1 - IMAGE
                ========================== -->

                <div class="simulation-card">

                    <img
                        src="simulation/SC4.png"
                        alt="For Kids Interactive City Game"
                    >

                    <div class="card-overlay">

                        <h3>
                            For Kids Interactive City Game
                        </h3>

                    </div>

                </div>


                <!-- =========================
                     CARD 2 - VIDEO
                ========================== -->

                <div class="simulation-card video-card">

                    <video
                        class="hover-video"
                        autoplay
                        muted
                        loop
                        playsinline
                        preload="auto"
                    >

                        <source
                            src="simulation/sc3.mp4"
                            type="video/mp4"
                        >

                        Your browser does not support video.

                    </video>


                    <div class="card-overlay">

                        <span>
                            VIDEO DEMO
                        </span>

                        <h3>
                            MS Simulation Tutorial 01
                        </h3>

                    </div>

                </div>


                <!-- =========================
                     CARD 3 - VIDEO
                ========================== -->

                <div class="simulation-card video-card">

                    <video
                        class="hover-video"
                        autoplay
                        muted
                        loop
                        playsinline
                        preload="auto"
                    >

                        <source
                            src="simulation/sc2.mp4"
                            type="video/mp4"
                        >

                        Your browser does not support video.

                    </video>


                    <div class="card-overlay">

                        <span>
                            VIDEO DEMO
                        </span>

                        <h3>
                            MS Simulation Tutorial 02
                        </h3>

                    </div>

                </div>


                <!-- =========================
                     CARD 4 - VIDEO
                ========================== -->

                <div class="simulation-card video-card">

                    <video
                        class="hover-video"
                        autoplay
                        muted
                        loop
                        playsinline
                        preload="auto"
                    >

                        <source
                            src="simulation/sc1.mp4"
                            type="video/mp4"
                        >

                        Your browser does not support video.

                    </video>


                    <div class="card-overlay">

                        <span>
                            VIDEO DEMO
                        </span>

                        <h3>
                            MS Simulation Tutorial 03
                        </h3>

                    </div>

                </div>


            </div>

        </div>

    </section>


</body>

</html>
